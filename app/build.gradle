plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}

def keystoreEnv = System.getenv('DOVE_ANDROID_KEYSTORE')?.trim()
def keystoreFile = null
def signingProps = new Properties()
if (keystoreEnv) {
    keystoreFile = file(keystoreEnv)
    if (keystoreFile.isDirectory()) keystoreFile = new File(keystoreFile, 'dove.jks')
    def signingPropsFile = new File(keystoreFile.parentFile, 'keystore.properties')
    if (!signingPropsFile.exists()) {
        throw new GradleException("Missing ${signingPropsFile} for DOVE_ANDROID_KEYSTORE")
    }
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'com.dove.thegallery'
    compileSdk 35

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "TheGallery-${variant.versionName}.apk"
        }
    }

    defaultConfig {
        applicationId 'com.dove.thegallery'
        minSdk 28
        targetSdk 35
        versionCode 4
        versionName '0.6'
    }

    signingConfigs {
        release {
            if (keystoreFile != null) {
                storeFile keystoreFile
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystoreFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
