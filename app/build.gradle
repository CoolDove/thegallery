plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}

android {
    namespace 'com.cooldove.thegallery'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cooldove.thegallery'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.11'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
