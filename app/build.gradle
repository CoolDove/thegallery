plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}

android {
    namespace 'com.dove.thegallery'
    compileSdk 35

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "TheGallery-${variant.versionName}.apk"
        }
    }

    defaultConfig {
        applicationId 'com.dove.thegallery'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
